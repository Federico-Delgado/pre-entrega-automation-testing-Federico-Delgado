[pytest]
testpaths = tests
addopts = -ra --strict-markers

markers =
    login: Pruebas relacionadas con inicio de sesión.
    catalogo: Pruebas relacionadas con navegación y verificación del catálogo.
    carrito: Pruebas relacionadas con interacción de productos y carrito.
    smoke: Pruebas críticas y rápidas.

# Logs visibles en consola durante la ejecución.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Archivo de log para evidencia de ejecución.
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S